<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sims 3 — Progressão Educacional e Carreiras</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#071522;color:#e6fbff}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#87ceeb}.launcher{position:fixed;z-index:5;right:14px;top:14px;border:1px solid #67e8f9;background:#082638ed;color:#d9fbff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 6px 25px #0008}.panel{position:fixed;z-index:6;top:64px;right:14px;width:min(470px,calc(100vw - 28px));max-height:calc(100vh - 82px);overflow:auto;border:1px solid #2dd4bf88;border-radius:20px;background:linear-gradient(180deg,#082634f5,#061825f7);box-shadow:0 18px 60px #000b;padding:16px;backdrop-filter:blur(16px)}.panel[hidden]{display:none}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:16px;margin:0;color:#a5f3fc}.head p{font-size:11px;color:#a5c6cf;margin:5px 0 0}.x,button,select{font:inherit}.x,.tab,.action,.primary,.secondary{border:1px solid #67e8f955;border-radius:10px;background:#102e41;color:#e6fbff;padding:8px 10px;cursor:pointer}.x{font-weight:900}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.tab{font-size:12px}.tab.active,.primary{background:#0e7490;border-color:#67e8f9}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.select-row{margin:10px 0}.select-row select{background:#0b1c29;color:#e6fbff;border:1px solid #2dd4bf66;border-radius:9px;padding:8px}.card{border:1px solid #67e8f933;background:#0b1c2acc;border-radius:14px;padding:12px;margin:9px 0}.card h3{margin:0 0 6px;font-size:14px;color:#ccfbf1}.muted{color:#a7c3ca;font-size:12px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:9px;background:#020b14aa;border-radius:10px;font-size:12px}.bar{height:7px;background:#172b3b;border-radius:8px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#34d399);border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.action{font-size:11px}.primary,.secondary{font-size:12px;font-weight:800}.course,.job{display:flex;align-items:center;justify-content:space-between;gap:10px}.toast{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);background:#082638;border:1px solid #67e8f9;border-radius:12px;padding:10px 14px;box-shadow:0 6px 25px #0009;font-size:12px}.small{font-size:11px;color:#a5c6cf}.warning{color:#fcd34d}.good{color:#86efac}@media(max-width:600px){.panel{top:auto;bottom:10px;right:10px;width:calc(100vw - 20px);max-height:67vh}.launcher{top:10px;right:10px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<iframe id="game" title="Jogo de simulação original" src="Sims%203%20Life%20Simulation%20(1).html"></iframe>
<button class="launcher" id="openPanel" type="button">🎓 Escola · Faculdade · Carreira</button>
<section class="panel" id="panel" hidden aria-label="Painel de progressão">
  <div class="head"><div><h1>PROGRESSÃO & CARREIRAS</h1><p>Educação, cursos, empregos e habilidades — integrado ao relógio e saldo do jogo.</p></div><button class="x" id="closePanel" aria-label="Fechar">✕</button></div>
  <div class="select-row row"><label for="simSelect" class="small">Sim ativo</label><select id="simSelect"><option value="0">Alex Green</option><option value="1">Bella Goth</option></select></div>
  <div class="tabs"><button class="tab active" data-tab="school">🏫 Escola</button><button class="tab" data-tab="university">🎓 Faculdade</button><button class="tab" data-tab="career">💼 Carreira</button><button class="tab" data-tab="skills">📈 Habilidades</button></div>
  <div id="content"></div>
  <p class="small">A simulação de aulas e expediente avança quando o relógio do jogo avança. Estado salvo neste navegador.</p>
</section>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
  'use strict';
  const COURSES = [
    {id:'education',name:'Educação',job:'Professora',tuition:1800,skill:'Liderança'},
    {id:'architecture',name:'Arquitetura e Urbanismo',job:'Arquiteta',tuition:2600,skill:'Criatividade'},
    {id:'law',name:'Direito e Criminologia',job:'Delegada',tuition:3200,skill:'Lógica'}
  ];
  const JOBS = [
    {id:'retail',name:'Atendente',course:null,days:[1,2,3,4,5],start:9,end:15,pay:90,skill:null,required:0},
    {id:'teacher',name:'Professora',course:'education',days:[1,2,3,4,5],start:8,end:14,pay:260,skill:'Liderança',required:2},
    {id:'architect',name:'Arquiteta',course:'architecture',days:[1,2,3,4,5],start:9,end:16,pay:340,skill:'Criatividade',required:2},
    {id:'detective',name:'Delegada',course:'law',days:[1,2,3,4,5],start:7,end:15,pay:390,skill:'Lógica',required:3}
  ];
  const fresh = () => ({age:'Adolescente',grade:7.5,study:0,attendance:0,schoolDays:0,scholarship:false,course:null,tuitionPaid:false,uniAttendance:0,examScore:null,degree:null,job:null,performance:50,skills:{Lógica:0,Carisma:0,Criatividade:0,Liderança:0},working:false,lastWorkDay:'',lastClassDay:'',lastSchoolDay:''});
  let saved;try{saved=JSON.parse(localStorage.getItem('simsEducationCareerV1')||'null')}catch(_){saved=null}
  const state={sims:Array.isArray(saved?.sims)&&saved.sims.length===2?saved.sims:[fresh(),fresh()],tab:'school',sim:0,lastClock:null};
  state.sims.forEach((s,i)=>{const base=fresh();Object.keys(base).forEach(k=>{if(s[k]===undefined)s[k]=base[k]});s.skills={...base.skills,...(s.skills||{})};if(i===0&&s.age==='Adolescente')s.grade=Math.max(s.grade,7.5)});
  const frame=document.getElementById('game'), panel=document.getElementById('panel'), content=document.getElementById('content'), toastEl=document.getElementById('toast');
  const save=()=>localStorage.setItem('simsEducationCareerV1',JSON.stringify({sims:state.sims}));
  const sim=()=>state.sims[state.sim];
  function notify(text){toastEl.textContent=text;toastEl.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastEl.hidden=true,3200)}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function readGame(){try{return frame.contentWindow.eval('({dayIndex:GAME.dayIndex,minutes:GAME.minutes,funds:GAME.funds})')}catch(_){return null}}
  function writeFunds(amount){try{frame.contentWindow.eval(`GAME.funds = Math.max(0, GAME.funds + (${Number(amount)}));`)}catch(_){notify('O jogo ainda está carregando; tente novamente em instantes.')}}
  function timeText(h){return `${String(h).padStart(2,'0')}:00`}
  const courseById=id=>COURSES.find(c=>c.id===id);
  const jobById=id=>JOBS.find(j=>j.id===id);
  function skillBars(){return Object.entries(sim().skills).map(([name,value])=>`<div class="stat"><div class="row"><b>${name}</b><span>${Math.floor(value)}/10</span></div><div class="bar"><i style="width:${Math.min(100,value*10)}%"></i></div></div>`).join('')}
  function renderSchool(){const s=sim(),grade=s.grade.toFixed(1),gradeName=s.grade>=9?'A':s.grade>=7?'B':s.grade>=5?'C':'D';return `<div class="card"><div class="row"><h3>Boletim escolar</h3><span class="${s.grade>=9?'good':''}">Nota ${grade} · ${gradeName}</span></div><p class="muted">Fase: <b>${escapeHtml(s.age)}</b> · Frequência: ${s.attendance} aulas · Estudos: ${s.study} sessões. A nota aumenta com estudo e presença.</p><div class="bar"><i style="width:${Math.min(100,s.grade*10)}%"></i></div><div class="actions"><button class="action" data-action="study">📚 Estudar agora (+nota, Lógica)</button><button class="action" data-action="school">🚌 Ir à escola</button><button class="action" data-action="age">🎂 Avançar fase de idade</button></div></div><div class="card"><h3>Benefício universitário</h3><p class="muted">${s.scholarship||s.grade>=9?'✅ Bolsa integral liberada para a faculdade.':'Tire nota final igual ou superior a 9,0 para garantir faculdade grátis.'}</p></div>`}
  function renderUniversity(){const s=sim();let course=courseById(s.course);let courses=COURSES.map(c=>`<div class="card course"><div><b>${c.name}</b><div class="muted">Habilita: ${c.job} · Mensalidade § ${c.tuition.toLocaleString('pt-BR')}</div></div><button class="primary" data-course="${c.id}">${s.course===c.id?'Selecionado':'Matricular'}</button></div>`).join('');let status=course?`<div class="card"><h3>${course.name}${s.degree?' — Diploma concluído':''}</h3><p class="muted">Aulas: ${s.uniAttendance}/8 · Próxima aula: dias úteis às 16h. Compareça a 8 aulas e faça a prova (nota ≥ 6) para se formar.</p><div class="bar"><i style="width:${Math.min(100,s.uniAttendance/8*100)}%"></i></div><div class="actions"><button class="action" data-action="class">📖 Assistir aula / estudar para prova</button><button class="action" data-action="exam">📝 Fazer prova</button></div></div>`:`<div class="card"><h3>Matrícula universitária</h3><p class="muted">Escolha o curso. Nota escolar ≥ 9 garante bolsa; caso contrário, pague a mensalidade exibida. Jovens adultos e adultos podem se matricular.</p></div>`;return status+`<div class="card"><h3>Cursos disponíveis</h3>${courses}</div>`}
  function renderCareer(){const s=sim(),degree=courseById(s.degree),current=jobById(s.job);let jobs=JOBS.map(j=>{let eligible=!j.course||s.degree===j.course;let requiredSkill=!j.skill||s.skills[j.skill]>=j.required;return `<div class="card job"><div><b>${j.name}</b><div class="muted">${j.course?`Diploma ${courseById(j.course).name}`:'Sem diploma'}${j.skill?` · ${j.skill} ${j.required}+`:''}<br>Seg–Sex, ${timeText(j.start)}–${timeText(j.end)} · § ${j.pay}/h</div></div><button class="${s.job===j.id?'secondary':'primary'}" data-job="${j.id}" ${(!eligible||!requiredSkill)?'disabled title="Requisitos não atendidos"':''}>${s.job===j.id?'Selecionado':'Escolher'}</button></div>`}).join('');return `<div class="card"><div class="row"><h3>Perfil profissional</h3><span>${current?escapeHtml(current.name):'Sem emprego'}</span></div><p class="muted">Desempenho diário: ${Math.round(s.performance)}% · ${degree?`Diploma: ${degree.name}`:'Sem diploma universitário'}${current?` · Expediente ${s.working?'em andamento':'aguardando horário'}`:''}</p><div class="bar"><i style="width:${s.performance}%"></i></div><div class="actions"><button class="primary" data-action="work" ${!current?'disabled':''}>🚗 Ir para o trabalho agora</button></div></div><div class="card"><h3>Vagas e requisitos</h3>${jobs}</div>`}
  function renderSkills(){return `<div class="card"><h3>Habilidades relacionadas</h3><p class="muted">Estude, crie e pratique para facilitar provas, contratação e promoções. Cada prática aumenta a habilidade correspondente.</p><div class="stats">${skillBars()}</div><div class="actions"><button class="action" data-skill="Lógica">🧩 Praticar lógica</button><button class="action" data-skill="Carisma">💬 Praticar carisma</button><button class="action" data-skill="Criatividade">🎨 Praticar criatividade</button><button class="action" data-skill="Liderança">🧭 Praticar liderança</button></div></div>`}
  function render(){if(!panel.hidden){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));content.innerHTML=state.tab==='school'?renderSchool():state.tab==='university'?renderUniversity():state.tab==='career'?renderCareer():renderSkills();}save()}
  document.getElementById('openPanel').onclick=()=>{panel.hidden=false;render()};document.getElementById('closePanel').onclick=()=>panel.hidden=true;
  document.getElementById('simSelect').onchange=e=>{state.sim=Number(e.target.value);render()};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  function addSkill(name,amount=1){const s=sim();s.skills[name]=Math.min(10,s.skills[name]+amount)}
  function action(type){const s=sim();if(type==='study'){s.study++;s.grade=Math.min(10,s.grade+.35);addSkill('Lógica',.5);if(s.grade>=9){s.scholarship=true;notify('Nota excelente! Bolsa integral para a faculdade desbloqueada.')}else notify('Sessão de estudo concluída; boletim e Lógica melhoraram.')}else if(type==='school'){s.attendance++;s.grade=Math.min(10,s.grade+.15);s.lastSchoolDay=dayKey();notify('Presença escolar registrada.')}else if(type==='age'){s.age=s.age==='Criança'?'Adolescente':s.age==='Adolescente'?'Jovem Adulto':s.age==='Jovem Adulto'?'Adulto':'Idoso';notify(`Nova fase de vida: ${s.age}.`)}else if(type==='class'){if(!s.course){notify('Matricule-se em um curso antes de assistir aulas.');return}if(!s.scholarship&&!s.tuitionPaid){const c=courseById(s.course);if(!spend(c.tuition)){notify('Saldo insuficiente para pagar a mensalidade.');return}s.tuitionPaid=true} s.uniAttendance=Math.min(8,s.uniAttendance+1);addSkill(courseById(s.course).skill,.5);notify(`Aula registrada (${s.uniAttendance}/8).`)}else if(type==='exam'){if(!s.course||s.uniAttendance<8){notify('É necessário estar matriculado e completar 8 aulas.');return}s.examScore=Math.min(10,5+s.uniAttendance*.4+(Object.values(s.skills).reduce((a,b)=>a+b,0)/40));if(s.examScore>=6){s.degree=s.course;notify(`Aprovado! Diploma em ${courseById(s.degree).name}.`)}else notify('Não foi desta vez. Estude mais e tente novamente.')}else if(type==='work'){const j=jobById(s.job);if(!j){notify('Escolha um emprego primeiro.');return}if(s.working){notify('O Sim já está trabalhando.');return}s.working=true;s.manualWorkUntil=Date.now()+6500;notify(`${j.name}: expediente iniciado. O salário será creditado ao terminar.`);setTimeout(()=>{if(s.working){completeWork(s,j);render()}},6500)}render()}
  function dayKey(){const g=readGame();return g?`${g.dayIndex}`:'0'}
  function spend(amount){const g=readGame();if(!g||g.funds<amount)return false;writeFunds(-amount);return true}
  function earn(amount){writeFunds(amount);notify(`Salário recebido: § ${Math.round(amount).toLocaleString('pt-BR')}.`)}
  function completeWork(s,j){s.working=false;s.performance=Math.min(100,s.performance+4+(s.skills[j.skill]||0)*.4);earn(j.pay*(j.end-j.start))}
  function chooseCourse(id){const s=sim(),c=courseById(id);if(s.age==='Criança'||s.age==='Adolescente'){notify('Avance para Jovem Adulto antes de se matricular.');return}if(s.degree){notify('Este Sim já possui um diploma.');return}if(!s.scholarship&&!s.tuitionPaid){if(!spend(c.tuition)){notify(`Saldo insuficiente para a mensalidade de § ${c.tuition.toLocaleString('pt-BR')}.`);return}s.tuitionPaid=true} s.course=id;s.uniAttendance=0;s.examScore=null;notify(`Matrícula confirmada em ${c.name}.`);render()}
  function chooseJob(id){const s=sim(),j=jobById(id);if(j.course&&s.degree!==j.course){notify(`É necessário concluir ${courseById(j.course).name}.`);return}if(j.skill&&s.skills[j.skill]<j.required){notify(`A habilidade ${j.skill} precisa chegar ao nível ${j.required}.`);return}s.job=id;notify(`Novo emprego: ${j.name}.`);render()}
  content.addEventListener('click',e=>{const a=e.target.closest('[data-action]'),c=e.target.closest('[data-course]'),j=e.target.closest('[data-job]'),sk=e.target.closest('[data-skill]');if(a)action(a.dataset.action);if(c)chooseCourse(c.dataset.course);if(j&&!j.disabled)chooseJob(j.dataset.job);if(sk){addSkill(sk.dataset.skill,.5);notify(`${sk.dataset.skill} aumentou.`);render()}});
  let lastToken='';
  function tick(){const g=readGame();if(!g)return;const token=`${g.dayIndex}:${Math.floor(g.minutes/60)}`;if(token===lastToken)return;lastToken=token;const s=sim(),hour=Math.floor(g.minutes/60),day=g.dayIndex%7,key=`${day}:${Math.floor(g.minutes/60)}`;
    if(s.course&&day>=1&&day<=5&&hour===16&&s.lastClassDay!==String(day)){s.lastClassDay=String(day);if(!s.scholarship&&!s.tuitionPaid){const c=courseById(s.course);if(g.funds>=c.tuition){writeFunds(-c.tuition);s.tuitionPaid=true}else{notify('Mensalidade pendente: aulas pausadas até regularizar.')}}if(s.tuitionPaid||s.scholarship){s.uniAttendance=Math.min(8,s.uniAttendance+1);addSkill(courseById(s.course).skill,.35);notify(`Aula da faculdade: ${s.uniAttendance}/8.`)}}
    if(s.age==='Criança'||s.age==='Adolescente'){if(day>=1&&day<=5&&hour===8&&s.lastSchoolDay!==key){s.lastSchoolDay=key;s.attendance++;s.grade=Math.min(10,s.grade+.1);if(s.grade>=9&&!s.scholarship){s.scholarship=true;notify('Desempenho escolar excelente: bolsa integral desbloqueada!')}}}
    const job=jobById(s.job);if(job&&job.days.includes(day)&&hour===job.start&&s.lastWorkDay!==key&&!s.working){s.lastWorkDay=key;s.working=true;setTimeout(()=>{if(s.working){completeWork(s,job);render()}},Math.max(3000,(job.end-job.start)*500));notify(`Expediente iniciado: ${job.name}.`)}
    if(!panel.hidden)render();else save();
  }
  setInterval(tick,700);frame.addEventListener('load',()=>{setTimeout(()=>{tick();notify('Progressão educacional conectada ao jogo. Use o botão no canto superior direito.')},500)});
  render();
})();
</script>
</body>
</html>
